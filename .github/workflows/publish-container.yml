name: Publish workshop container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build workshop image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: masts-workshop:test
          build-args: |
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Python, Julia and PNG generation
        run: ./scripts/test_container.sh masts-workshop:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image to GHCR
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="sha-${GITHUB_SHA:0:12}"
          docker tag masts-workshop:test "$image:$revision"
          docker tag masts-workshop:test "$image:latest"
          docker push "$image:$revision"
          docker push "$image:latest"
          docker inspect --format='{{json .RepoDigests}}' "$image:$revision"
