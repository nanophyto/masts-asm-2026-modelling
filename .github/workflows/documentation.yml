name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "1"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Require committed scientific manifest
        run: test -f oceanbiome/Manifest.toml
      - name: Instantiate scientific environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --startup-file=no --project=oceanbiome -e 'using Pkg; Pkg.instantiate()'
      - name: Instantiate documentation environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build documentation and validate plotting
        env:
          DOCS_QUICK: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --startup-file=no --project=docs docs/make.jl
