name: Documentation and Pages

# One documentation build per PR update, then another on main for publication.
# Feature-branch pushes are covered by the pull_request event.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      # Cache Julia dependencies for speed; simulations and figures run afresh.
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Instantiate documentation environment
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Test documentation image validator
        run: python3 -m unittest discover -s scripts -p 'test_documentation_images.py'
      - name: Run all OceanBioME exercises and build documentation
        env:
          DOCS_QUICK: "false"
          DOCS_CONTENT_ONLY: "false"
          DOCS_REUSE_RESULTS: "false"
        # Each build runs the seven existing annual exercises plus both
        # Atlantic station controls, checks diagnostics, and regenerates figures.
        # GitHub Pages deployment is handled by the official actions below.
        run: |
          rm -rf outputs/oceanbiome/reference_docs
          env -u GITHUB_ACTIONS julia --startup-file=no --project=docs docs/make.jl
      - name: Verify generated pages and figure links
        run: python3 scripts/check_documentation_images.py docs/build
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-documentation
          path: docs/build/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
