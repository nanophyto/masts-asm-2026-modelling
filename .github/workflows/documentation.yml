name: Workshop landing page

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check workstation configuration and importer
        run: |
          python3 scripts/update_landing_page.py --check
          python3 -m unittest discover -s tests -p 'test_landing_*.py' -v
      - name: Check browser JavaScript syntax
        run: node --check site/app.js

  deploy:
    name: Publish landing page
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy landing page
        id: deployment
        uses: actions/deploy-pages@v4
