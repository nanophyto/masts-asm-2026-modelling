name: Documentation and Pages

# Test proposed changes on PRs, and run on main only after merge.
# This avoids duplicate runs from a feature-branch push with an open PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: "Regenerate all annual scientific simulations and figures"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      # Fast default publishes all tutorial pages using committed figures.
      # Manual full_build regenerates the simulations and figures.
      DOCS_CONTENT_ONLY: ${{ inputs.full_build == true && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Instantiate documentation environment
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build documentation
        # Prevent docs/make.jl from invoking its legacy deploydocs branch;
        # GitHub Pages deployment is handled below with official actions.
        run: env -u GITHUB_ACTIONS julia --startup-file=no --project=docs docs/make.jl
      - name: Verify generated pages and included figures
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/build/index.html
          for page in 00_reference_column 01_grazing 02_sinking 03_remineralisation \
                      04_light_affinity 05_nutrient_affinity 06_phytoplankton_mortality \
                      physical_forcing; do
            test -s "docs/build/generated/${page}/index.html" || {
              echo "Missing generated documentation page: $page" >&2
              exit 1
            }
          done
          test -s docs/build/assets/reference_carbon_export.png
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-documentation
          path: docs/build/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
