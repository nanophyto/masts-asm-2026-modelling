name: Smoke tests

# Test proposed changes on PRs, and run on main only after merge.
# This avoids duplicate runs from a feature-branch push with an open PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: abil/requirements.txt
      - name: Install Abil
        run: python -m pip install -r abil/requirements.txt numpy scipy matplotlib
      - name: Test Python imports
        run: python -m unittest discover -s abil/tests -p 'test_*.py' -v
      - name: Test editor setup and persistent workstation warm-up
        run: python -m unittest discover -s container -p 'test_*.py' -v
      - name: Test participant launch links
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  julia:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Require committed Julia manifest
        run: test -f oceanbiome/Manifest.toml
      - name: Instantiate Julia environment without eager plotting precompilation
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: julia --startup-file=no --project=oceanbiome -e 'using Pkg; Pkg.instantiate()'
      - name: Test Julia imports and versions
        run: julia --startup-file=no --project=oceanbiome oceanbiome/test/runtests.jl
      - name: Run annual scientific parameter exercises and check diagnostics
        run: |
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/01_grazing.jl
          test -s workshop/results/oceanbiome/grazing/control_diagnostics.csv
          test -s workshop/results/oceanbiome/grazing/reduced_grazing_diagnostics.csv
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/02_sinking.jl
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/03_remineralisation.jl
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/04_light_affinity.jl
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/05_nutrient_affinity.jl
          julia --startup-file=no --project=oceanbiome workshop/01_OceanBioME/06_phytoplankton_mortality.jl
          for experiment in sinking remineralisation light_affinity nutrient_affinity phytoplankton_mortality; do
            test -s "workshop/results/oceanbiome/$experiment/control_diagnostics.csv"
            test -s "workshop/results/oceanbiome/$experiment/${experiment}_response.png"
            test -s "workshop/results/oceanbiome/$experiment/${experiment}_export.png"
          done
