name: Abil workshop checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: abil/requirements.txt
      - name: Install Abil dependencies
        run: python -m pip install -r abil/requirements.txt numpy scipy matplotlib
      - name: Smoke-test Abil imports and example data
        run: python -m unittest discover -s abil/tests -p 'test_*.py' -v
      - name: Check workshop image contract
        run: python -m unittest discover -s tests -p 'test_abil_environment.py' -v
