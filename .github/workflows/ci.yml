name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: abil/requirements.txt
      - name: Install Abil dependencies
        run: python -m pip install -r abil/requirements.txt numpy scipy matplotlib
      - name: Smoke-test Abil imports and example data
        run: python -m unittest discover -s abil/tests -p 'test_*.py' -v

  julia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Instantiate scientific environment
        run: julia --startup-file=no --project=oceanbiome -e 'using Pkg; Pkg.instantiate()'
      - name: Run short scientific smoke tests
        run: julia --startup-file=no --threads=1 --project=oceanbiome oceanbiome/test/runtests.jl
      # The documentation workflow runs every 365-day experiment and verifies
      # its figures and diagnostic CSVs, avoiding duplicate annual CI runs.
